<!doctype html><html><head><style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
// หน้าอัดภาพนิ่ง/วิดีโอของบ้านและห้อง จากไฟล์โมเดล .glb (ใช้ทำรูปทุกรูปในหน้า /house)
// ภายนอก: ท้องฟ้า + แดดเย็นมีเงา + พื้นดิน + หมอกไกลๆ / ภายใน (env=room): แสงสะท้อนนุ่มแบบในห้อง + แดดลอดหน้าต่าง
// ตั้งค่าทุกอย่างผ่าน query string (ดูวิธีใช้ใน scripts/render/shots.mjs) แล้วสคริปต์สั่ง window.shotArr(ตำแหน่งกล้อง, จุดที่มอง, fov)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? +q.get(k) : d);
const vec = (k, d) => new THREE.Vector3(...(q.get(k) || d).split(',').map(Number));
const W = num('w', 1600), H = num('h', 900);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = num('exp', 0.6);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const sky = new Sky(); sky.scale.setScalar(10000); scene.add(sky);
const U = sky.material.uniforms; U.turbidity.value = 6; U.rayleigh.value = 1.6; U.mieCoefficient.value = 0.004; U.mieDirectionalG.value = 0.85;
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - num('sunEl', 22)), THREE.MathUtils.degToRad(num('sunAz', 215)));
U.sunPosition.value.copy(sunDir);
const pm = new THREE.PMREMGenerator(r);
if (q.get('env') === 'room') scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
else { const es = new THREE.Scene(); const s2 = new Sky(); s2.scale.setScalar(10000); for (const k in U) s2.material.uniforms[k].value = U[k].value; es.add(s2); scene.environment = pm.fromScene(es).texture; }
scene.environmentIntensity = num('envI', 0.6);
const C = vec('c', '0,0,0'), SH = num('sh', 30);
const sun = new THREE.DirectionalLight(q.get('sunC') || '#ffd9a8', num('sun', 4.5));
sun.position.copy(C).addScaledVector(sunDir, SH * 2); sun.target.position.copy(C); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 0.1, far: SH * 5 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = num('nb', 0.03); sun.shadow.radius = 3;
scene.add(new THREE.HemisphereLight('#cfe0ff', '#8a7a62', num('hemi', 0.35)));
for (const s of (q.get('pl') || '').split(';').filter(Boolean)) { // x,y,z,color,intensity,distance
  const [x, y, z, c, i, d] = s.split(','); const l = new THREE.PointLight(c, +i, +d || 0, 2); l.position.set(+x, +y, +z); scene.add(l);
}
if (q.get('ground') !== 'none') {
  const gtex = new THREE.TextureLoader().load('/scripts/render/ground.jpg'); gtex.wrapS = gtex.wrapT = THREE.RepeatWrapping; gtex.repeat.set(60, 60); gtex.colorSpace = THREE.SRGBColorSpace; gtex.anisotropy = 8;
  const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 64), new THREE.MeshStandardMaterial({ color: q.get('ground') || '#c8bba0', map: gtex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(C.x, num('gy', -0.02), C.z); ground.receiveShadow = true; scene.add(ground);
  scene.fog = new THREE.Fog(new THREE.Color(q.get('fog') || '#d9cfc0'), num('fogN', 80), num('fogF', 360));
}
const cam = new THREE.PerspectiveCamera(num('fov', 35), W / H, num('near', 0.05), 3000);
const composer = new EffectComposer(r);
composer.addPass(new RenderPass(scene, cam));
const ao = new GTAOPass(scene, cam, W, H); ao.updateGtaoMaterial({ radius: num('aoR', 0.6), distanceFallOff: 1, thickness: 1 }); ao.blendIntensity = num('ao', 1);
if (q.get('ao') !== '0') composer.addPass(ao);
composer.addPass(new OutputPass());
window.pick = (x, y) => { const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(x, y), cam); return rc.intersectObjects(scene.children, true).filter(h => h.object.visible && h.object.isMesh).slice(0, 4).map(h => `${h.object.name} | ${[].concat(h.object.material).map(m => m.name + ' ' + m.color.getHexString() + ' m' + m.metalness + ' o' + m.opacity).join(',')} | d${h.distance.toFixed(2)}`); };
window.shotArr = (p, l, f) => window.shot(new THREE.Vector3(...p), new THREE.Vector3(...l), f);
window.shot = (pos, look, fov) => { cam.position.copy(pos); if (fov) { cam.fov = fov; cam.updateProjectionMatrix(); } cam.lookAt(look); composer.render(); };
const hide = q.get('hide') ? new RegExp(q.get('hide'), 'i') : null;
const METAL = /chrome|metal|steel|alumin|copper|gold|brass|inox/i, GLASS = /glass|vidrio|cristal|translu/i;
const fixes = q.get('mat') ? JSON.parse(q.get('mat')) : {}; // { "material name regex": { color, rough, metal, op, emi } }
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(q.get('m'), (g) => {
  const hidden = [];
  g.scene.traverse((o) => {
    if (hide && hide.test(o.name)) { o.visible = false; hidden.push(o.name); }
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    for (const m of [].concat(o.material)) {
      if (q.get('fix') === '1') {
        m.vertexColors = false;
        if (METAL.test(m.name)) { m.metalness = 1; m.roughness = Math.min(m.roughness, 0.3); } else if (!m.metalnessMap) m.metalness = 0;
        if (GLASS.test(m.name)) { m.transparent = true; m.opacity = 0.12; m.color.set('#ffffff'); m.roughness = 0.03; m.metalness = 0; m.depthWrite = false; o.castShadow = false; }
      }
      for (const [k, f] of Object.entries(fixes)) if (new RegExp(k, 'i').test(m.name)) {
        if (f.color) m.color.set(f.color); if (f.rough != null) m.roughness = f.rough; if (f.metal != null) m.metalness = f.metal;
        if (f.op != null) { m.transparent = f.op < 1; m.opacity = f.op; m.depthWrite = f.op >= 1; if (f.op < 1) o.castShadow = false; }
        if (f.emi) { m.emissive = new THREE.Color(f.emi); m.emissiveIntensity = f.emiI ?? 1; }
        if (f.nomap) m.map = null;
        m.needsUpdate = true;
      }
    }
  });
  g.scene.scale.setScalar(num('s', 1));
  scene.add(g.scene);
  const box = new THREE.Box3().setFromObject(g.scene);
  window.INFO = { min: box.min.toArray().map((v) => +v.toFixed(2)), max: box.max.toArray().map((v) => +v.toFixed(2)), hidden: hidden.length };
  const p = vec('pos', '10,6,10'), l = vec('look', '0,1,0');
  window.shot(p, l);
  setTimeout(() => { window.shot(p, l); window.DONE = true; }, 500);

</script></body></html>
